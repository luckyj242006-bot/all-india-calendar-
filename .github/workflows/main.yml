name: Build Standalone Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Standalone Native App
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "India Calendar" "com.joshi.allcalender" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Configure Keystore and Minimum SDK 24
        run: |
          # 1. Decode keystore file
          echo "" | base64 -d > android/release.keystore

          # 2. Update minSdkVersion to 24 for Google Play automatic protection
          node -e "
            const fs = require('fs');
            let vg = fs.readFileSync('android/variables.gradle', 'utf8');
            vg = vg.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 24');
            fs.writeFileSync('android/variables.gradle', vg);

            let bg = fs.readFileSync('android/app/build.gradle', 'utf8');
            bg = bg.replace('buildTypes {', \`
                signingConfigs {
                    release {
                        storeFile file('../release.keystore')
                        storePassword '4S97JnubxmcX'
                        keyAlias 'my-key-alias'
                        keyPassword '4S97JnubxmcX'
                    }
                }
                buildTypes {
            \`);
            bg = bg.replace('buildTypes {\\n        release {', 'buildTypes {\\n        release {\\n            signingConfig signingConfigs.release');
            fs.writeFileSync('android/app/build.gradle', bg);
          "

      - name: Build Signed Standalone AAB & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Upload Standalone APK (Install directly on phone)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-Standalone-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Standalone AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
