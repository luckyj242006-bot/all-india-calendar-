name: Build Standalone Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Standalone Native App
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "India Calendar" "com.joshi.allcalender" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Build Standalone APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Standalone APK (Install directly on phone)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-Standalone-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Standalone AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-Standalone-AAB
          path: android/app/build/outputs/bundle/release/*.aab
