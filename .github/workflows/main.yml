name: Build Standalone Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Standalone Native App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "India Calendar" "com.joshi.allcalender" --web-dir "."
          npx cap add android
          npx cap sync android

      - name: Build Standalone APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Standalone APK (Install on any phone)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-Standalone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Standalone AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: India-Calendar-Standalone-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
