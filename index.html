<!-- Canvas Confetti for Festive Celebrations -->

<style>
:root {
  --primary: #0e5a60;
  --primary-light: #167a83;
  --primary-dark: #073539;
  --primary-gradient: linear-gradient(135deg, #0a3d43 0%, #115e66 50%, #198791 100%);
  --accent: #f59e0b;
  --accent-gold: #d97706;
  --bg: #f4f7f6;
  --surface: #ffffff;
  --surface-glass: rgba(255, 255, 255, 0.85);
  --border: #e2e8e7;
  --text: #132427;
  --text-muted: #5f7478;
  --badge-fest: #dc2626;
  --badge-vrat: #0284c7;
  --badge-nat: #16a34a;
  --badge-moon: #8b5cf6;
  --danger: #ef4444;
  --success: #10b981;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 24px rgba(14, 90, 96, 0.08);
  --shadow-lg: 0 16px 36px rgba(14, 90, 96, 0.14);
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-serif: 'Rozha One', 'Yatra One', Georgia, serif;
}

[data-theme="saffron"] {
  --primary: #c2410c;
  --primary-light: #ea580c;
  --primary-dark: #7c2d12;
  --primary-gradient: linear-gradient(135deg, #7c2d12 0%, #c2410c 50%, #ea580c 100%);
  --accent: #eab308;
  --bg: #fffbf5;
  --border: #fed7aa;
  --shadow-md: 0 8px 24px rgba(194, 65, 12, 0.1);
}

[data-theme="dark"] {
  --primary: #14b8a6;
  --primary-light: #2dd4bf;
  --primary-dark: #0f766e;
  --primary-gradient: linear-gradient(135deg, #091a1d 0%, #0f3539 60%, #154c52 100%);
  --accent: #fbbf24;
  --bg: #0b1315;
  --surface: #121d20;
  --surface-glass: rgba(18, 29, 32, 0.88);
  --border: #1f3338;
  --text: #e6f1f2;
  --text-muted: #8aa1a6;
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding-bottom: 96px;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
}

/* App Container */
.container {
  max-width: 620px;
  width: 100%;
  margin: 0 auto;
  padding: 12px 8px 120px;
  box-sizing: border-box;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.4)); }
  50% { filter: drop-shadow(0 0 24px rgba(251, 191, 36, 0.8)); }
}

@keyframes ripple {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1); opacity: 0.95; }
}

.anim-fade { animation: fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

/* Top App Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0 8px;
}
.app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(14, 90, 96, 0.25);
  font-size: 20px;
}
.brand-title {
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text) 0%, var(--primary-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.lang-badge {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.lang-badge:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
  position: relative;
}
.card:hover {
  box-shadow: var(--shadow-md);
}

/* Hero Section */
.hero-card {
  background: var(--primary-gradient);
  color: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.hero-card::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
  pointer-events: none;
}
.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.hero-city-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: 0.2s;
}
.hero-city-tag:hover { background: rgba(255, 255, 255, 0.25); }

.hero-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 18px 0 14px;
}
.hero-date-block {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.hero-big-day {
  font-size: 4.8rem;
  font-weight: 800;
  line-height: 0.85;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-sans);
}
.hero-month-year {
  display: flex;
  flex-direction: column;
}
.hero-month-year .month {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;
}
.hero-month-year .year {
  font-size: 1.05rem;
  opacity: 0.85;
}
.hero-weekday {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.moon-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.moon-disc {
  filter: drop-shadow(0 4px 14px rgba(0,0,0,0.3));
  transition: transform 0.4s ease;
}
.moon-disc:hover { transform: scale(1.08) rotate(5deg); }
.moon-tithi-txt {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  opacity: 0.9;
  text-align: center;
}

.hero-panchang-summary {
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-top: 10px;
}
.hero-tithi-title {
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.2;
}
.hero-tithi-sub {
  font-size: 0.85rem;
  opacity: 0.85;
  margin-top: 2px;
}

/* Quick Stats Bar */
.sun-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.stat-pill {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 8px 10px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.stat-pill small {
  display: block;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.75;
  font-weight: 600;
}
.stat-pill b {
  font-size: 0.95rem;
  font-weight: 700;
  margin-top: 2px;
  display: block;
}

.hero-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.btn-glass {
  flex: 1;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.btn-glass:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

/* Section Header */
.sec-title {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
}
.sec-title span { display: flex; align-items: center; gap: 6px; }

/* Quick Highlight Tiles */
.tiles-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.feature-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.feature-tile::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--tile-color, var(--primary));
}
.feature-tile:hover {
  transform: translateY(-2px);
  border-color: var(--primary-light);
  box-shadow: var(--shadow-md);
}
.feature-tile .label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
}
.feature-tile .value {
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.2;
}
.feature-tile .sub {
  font-size: 0.75rem;
  color: var(--primary);
  font-weight: 600;
}

/* Muhurat Card (Rahu Kaal / Abhijit) */
.muhurat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}
.muhurat-box {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
}
.muhurat-box.good {
  border-color: #86efac;
  background: rgba(16, 185, 129, 0.06);
}
.muhurat-box.bad {
  border-color: #fca5a5;
  background: rgba(239, 68, 68, 0.06);
}
.muhurat-box small {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.muhurat-box.good small { color: var(--success); }
.muhurat-box.bad small { color: var(--danger); }
.muhurat-box b {
  display: block;
  font-size: 0.95rem;
  font-weight: 700;
  margin-top: 4px;
}

/* Next Major Festival Card */
.next-fest-card {
  display: flex;
  align-items: center;
  gap: 16px;
}
.next-date-badge {
  flex-shrink: 0;
  width: 68px;
  height: 68px;
  border-radius: 16px;
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  color: #78350f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
}
[data-theme="dark"] .next-date-badge {
  background: linear-gradient(135deg, #78350f 0%, #b45309 100%);
  color: #fef3c7;
}
.next-date-badge .day-num {
  font-size: 1.8rem;
  font-weight: 800;
  line-height: 1;
}
.next-date-badge .month-lbl {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
}
.next-fest-info { flex: 1; min-width: 0; }
.next-fest-info h4 {
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1.25;
}
.next-fest-info p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 3px;
}
.next-fest-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

/* Buttons */
.btn {
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  color: var(--text);
}
.btn:hover {
  background: var(--bg);
  border-color: var(--primary);
}
.btn.primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.btn.primary:hover {
  background: var(--primary-light);
}
.btn.sm { padding: 5px 10px; font-size: 0.78rem; }
.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
}

/* Calendar Grid Header */
.calendar-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.cal-title-block h3 {
  font-size: 1.35rem;
  font-weight: 800;
}
.cal-title-block p {
  font-size: 0.82rem;
  color: var(--text-muted);
}
.cal-nav-btns {
  display: flex;
  gap: 6px;
}

/* Weekday header */
.cal-dow-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
  text-align: center;
  font-size: 0.70rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  width: 100% !important;
  box-sizing: border-box !important;
}
.cal-dow-grid .sun { color: var(--danger); }

/* Day Cells */
.cal-month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
  gap: 3px !important;
  width: 100% !important;
  box-sizing: border-box !important;
}
.cal-cell {
  aspect-ratio: 1 / 1.25;
  min-width: 0 !important;
  width: 100% !important;
  box-sizing: border-box !important;
  background: var(--surface);
  border: 1.5px solid transparent;
  border-radius: 8px;
  padding: 3px 1px !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  position: relative;
  overflow: hidden !important;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.cal-cell:hover {
  border-color: var(--primary-light);
  transform: translateY(-2px);
  z-index: 2;
}
.cal-cell.other-month {
  opacity: 0.35;
}
.cal-cell.today {
  border-color: var(--primary);
  background: rgba(14, 90, 96, 0.08);
}
.cal-cell.selected {
  background: var(--primary);
  color: #fff !important;
  box-shadow: 0 4px 14px rgba(14, 90, 96, 0.3);
  transform: scale(1.02);
}
.cal-cell.selected .cal-cell-tithi {
  color: rgba(255, 255, 255, 0.9) !important;
}
.cal-cell.sun .cal-cell-num {
  color: var(--danger);
}
.cal-cell.selected.sun .cal-cell-num {
  color: #fff;
}
.cal-cell-num {
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1;
}
.cal-cell-tithi {
  font-size: 0.50rem !important;
  color: var(--text-muted);
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  max-width: 100% !important;
  display: block !important;
  font-weight: 500;
  text-align: center;
  line-height: 1.1;
  padding: 0 1px;
}
.cal-indicators {
  display: flex;
  gap: 2px;
  align-items: center;
  justify-content: center;
  min-height: 5px;
}
.cal-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--dot-color, var(--accent));
}

/* Agenda / Month List View Styles */
.month-agenda-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
  max-height: 420px;
  overflow-y: auto;
  padding-right: 4px;
}
.agenda-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
}
.agenda-row:hover, .agenda-row.selected {
  border-color: var(--primary);
  background: rgba(14, 90, 96, 0.08);
}
.agenda-date-box {
  display: flex;
  align-items: center;
  gap: 10px;
}
.agenda-num {
  font-size: 1.15rem;
  font-weight: 800;
  min-width: 28px;
  text-align: center;
}
.agenda-dow {
  font-size: 0.70rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
}
.agenda-meta {
  display: flex;
  flex-direction: column;
}
.agenda-tithi {
  font-size: 0.82rem;
  font-weight: 600;
}
.agenda-nak {
  font-size: 0.72rem;
  color: var(--text-muted);
}
.agenda-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--badge-fest);
  color: #fff;
  white-space: nowrap;
}
  border-radius: 50%;
  background: var(--dot-color, var(--badge-fest));
}
.cal-moon-icon {
  font-size: 8px;
  line-height: 1;
}

/* Day Details Drawer/Card */
.day-details-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
  margin-bottom: 12px;
}
.day-details-title h3 {
  font-size: 1.3rem;
  font-weight: 800;
}
.day-details-title p {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Observance row in day detail */
.obs-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  align-items: flex-start;
}
.obs-item:first-of-type { border-top: none; }
.obs-badge {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 7px;
  flex-shrink: 0;
}
.obs-content { flex: 1; }
.obs-content h5 { font-size: 1.05rem; font-weight: 700; }
.obs-content p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

/* Calendar Accordion Rows (All Regional Calendars) */
.regional-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}
.regional-table tr {
  border-bottom: 1px solid var(--border);
}
.regional-table tr:last-child { border-bottom: none; }
.regional-table td {
  padding: 9px 0;
  font-size: 0.88rem;
}
.regional-table td.label {
  color: var(--text-muted);
  font-weight: 600;
  width: 40%;
}
.regional-table td.val {
  font-weight: 700;

  outline: none;
  transition: all 0.2s ease;
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(14, 90, 96, 0.15);
}
.search-icon-svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

  display: flex;
  gap: 8px;

.chip-btn {
  padding: 6px 14px;

  background: var(--surface);

  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  color: var(--text-muted);

}
.chip-btn.active {
  background: var(--primary);

}

.fest-item-card {
  display: flex;

  background: var(--surface);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.fest-item-card:hover {
  border-color: var(--primary-light);
  transform: translateX(4px);
}

#toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: rgba(19, 36, 39, 0.95);
  color: #fff;
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  pointer-events: none;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 999;
  display: flex;
  align-items: center;
  gap: 8px;
}
#toast.show {
  transform: translateX(-50%) translateY(0);

}

.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;

  border: none;

  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  padding: 4px 12px;
  border-radius: 12px;
  transition: all 0.2s ease;
}
.tab-btn svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  transition: transform 0.2s ease;
}
.tab-btn.active {
  color: var(--primary);
}
.tab-btn.active svg {
  transform: translateY(-2px);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

  background: var(--surface);

  padding: 24px;

@keyframes slideUp {

}
.modal-header {

  align-items: center;
  margin-bottom: 16px;

  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

}

.setting-label b { display: block; font-size: 0.95rem; }
.setting-label small { color: var(--text-muted); font-size: 0.8rem; }
.custom-select {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-weight: 600;
  outline: none;
  max-width: 55%;
}

.switch {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 28px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: var(--border);
  transition: 0.25s;
  border-radius: 34px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.25s;
  border-radius: 50%;
}
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(20px); }

<script>
/* =========================================================================
   1. ASTRONOMICAL COMPUTATION ENGINE (Meeus Low-Precision series)
   ========================================================================= */
const Eng = (function() {
  const RAD = Math.PI / 180;
  function norm(x) { x = x % 360; return x < 0 ? x + 360 : x; }
  function jdUT(y, m, d, h) { return Date.UTC(y, m - 1, d, h || 0) / 86400000 + 2440587.5; }
  
  function sunLon(jd) {
    const T = (jd - 2451545) / 36525;
    const L0 = 280.46646 + 36000.76983 * T;
    const M = 357.52911 + 35999.05029 * T;
    const C = (1.914602 - 0.004817 * T) * Math.sin(M * RAD) + 0.019993 * Math.sin(2 * M * RAD) + 0.000289 * Math.sin(3 * M * RAD);
    return norm(L0 + C - 0.00569);
  }

  function moonLon(jd) {
    const T = (jd - 2451545) / 36525;
    const Lp = 218.3164477 + 481267.88123421 * T;
    const D = 297.8501921 + 445267.1114034 * T;
    const M = 357.5291092 + 35999.0502909 * T;
    const Mp = 134.9633964 + 477198.8675055 * T;
    const F = 93.2720950 + 483202.0175233 * T;
    const s = (x) => Math.sin(x * RAD);
    const l = Lp + 6.288774*s(Mp) + 1.274027*s(2*D - Mp) + 0.658314*s(2*D) + 0.213618*s(2*Mp)
            - 0.185116*s(M) - 0.114332*s(2*F) + 0.058793*s(2*D - 2*Mp) + 0.057066*s(2*D - M - Mp)
            + 0.053322*s(2*D + Mp) + 0.045758*s(2*D - M) - 0.040923*s(M - Mp) - 0.034720*s(D);
    return norm(l - 0.00478 * s(125.04 - 1934.136 * T));
  }

  function ayanamsa(jd) { return 23.85306 + ((jd - 2451545) / 365.25) * 0.013969; } // Lahiri
  function sunSid(jd) { return norm(sunLon(jd) - ayanamsa(jd)); }
  function moonSid(jd) { return norm(moonLon(jd) - ayanamsa(jd)); }
  function elong(jd) { return norm(moonLon(jd) - sunLon(jd)); }
  function signedElong(jd) { const e = elong(jd); return e > 180 ? e - 360 : e; }

  function newMoonBefore(jd) {
    let t = jd - elong(jd) / 12.19;
    for (let i = 0; i < 8; i++) t -= signedElong(t) / 12.19;
    if (t > jd + 0.01) t -= 29.53;
    return t;
  }
  function newMoonAfter(jd) {
    const nextGuess = newMoonBefore(jd + 30.7);
    return nextGuess > jd ? nextGuess : newMoonBefore(jd + 32.5);
  }

  function sunTimes(y, m, d, lat, lon, tz = 5.5) {
    const jd = jdUT(y, m, d, 12 - tz);
    const T = (jd - 2451545) / 36525;
    const L0 = norm(280.46646 + 36000.76983 * T);
    const M = 357.52911 + 35999.05029 * T;
    const e = 0.016708634 - 0.000042037 * T;
    const C = (1.914602 - 0.004817 * T) * Math.sin(M * RAD) + 0.019993 * Math.sin(2 * M * RAD);
    const lam = L0 + C - 0.00569;
    const eps = 23.439291 - 0.0130042 * T;
    const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lam * RAD));
    const yy = Math.pow(Math.tan(eps * RAD / 2), 2);
    const eq = (4 / RAD) * (yy * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * yy * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * yy * yy * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD));
    const cosHA = (Math.cos(90.833 * RAD) - Math.sin(lat * RAD) * Math.sin(decl)) / (Math.cos(lat * RAD) * Math.cos(decl));
    const ha = Math.acos(Math.max(-1, Math.min(1, cosHA))) / RAD;
    const noon = 720 - 4 * lon - eq + tz * 60;
    return { rise: noon - 4 * ha, set: noon + 4 * ha, noon };
  }

  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  
  function nationalDate(y, m, d) {
    let start = Date.UTC(y, 2, isLeap(y) ? 21 : 22);
    let t = Date.UTC(y, m - 1, d);
    let yr = y - 78;
    if (t < start) {
      y = y - 1;
      start = Date.UTC(y, 2, isLeap(y) ? 21 : 22);
      yr = y - 78;
    }
    let n = Math.round((t - start) / 86400000);
    const lens = [isLeap(y) ? 31 : 30, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30];
    let i = 0;
    while (n >= lens[i]) { n -= lens[i]; i++; }
    return { d: n + 1, m: i, y: yr };
  }

  function rashiAt(jd) { return Math.floor(sunSid(jd) / 30); }

  function solarMonth(y, m, d, refHourIST) {
    const ref = (dd) => jdUT(dd.y, dd.m, dd.d, refHourIST - 5.5);
    let cur = { y, m, d };
    const r = rashiAt(ref(cur));
    let day = 1;
    for (let i = 0; i < 33; i++) {
      const p = new Date(Date.UTC(cur.y, cur.m - 1, cur.d - 1));
      const pd = { y: p.getUTCFullYear(), m: p.getUTCMonth() + 1, d: p.getUTCDate() };
      if (rashiAt(ref(pd)) !== r) break;
      day++;
      cur = pd;
    }
    return { m: r, d: day };
  }

  function computePanchang(y, m, d, city = { lat: 28.61, lon: 77.21 }) {
    const st = sunTimes(y, m, d, city.lat, city.lon, 5.5);
    const jd = jdUT(y, m, d, 0) + (st.rise - 330) / 1440;
    const e = elong(jd);
    const tIdx = Math.floor(e / 12); // 0..29
    const paksha = tIdx < 15 ? 'S' : 'K';
    const tn = (tIdx % 15) + 1;
    const nm0 = newMoonBefore(jd);
    const nm1 = newMoonAfter(nm0 + 1);
    const r0 = rashiAt(nm0 + 0.02);
    const r1 = rashiAt(nm1 + 0.02);
    const adhika = (r0 === r1);
    const mon = (r0 + 1) % 12;
    const purni = paksha === 'K' ? (mon + 1) % 12 : mon;
    
    let chaitradi = y + 57;
    if (m <= 2 || (m === 3 && (mon === 10 || mon === 11))) chaitradi = y + 56;
    const gujYear = (mon >= 0 && mon <= 6) ? chaitradi - 1 : chaitradi;

    const nat = nationalDate(y, m, d);
    const tam = solarMonth(y, m, d, 18);
    const ben = solarMonth(y, m, d, 0);
    const bYear = (ben.m <= 8 && m >= 4) ? y - 593 : y - 594;
    const nak = Math.floor(moonSid(jd) / (360 / 27));

    // Calculate Rahu Kaal, Yamaganda, Gulika & Abhijit Muhurat
    const dayLength = st.set - st.rise;
    const seg = dayLength / 8;
    const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); // 0:Sun, 1:Mon, etc.
    
    // Rahu Kaal segment offsets (Sun=7, Mon=1, Tue=6, Wed=4, Thu=5, Fri=3, Sat=2)
    const rahuSegments = [7, 1, 6, 4, 5, 3, 2];
    const rahuIdx = rahuSegments[w];
    const rahuStart = st.rise + (rahuIdx - 1) * seg;
    const rahuEnd = st.rise + rahuIdx * seg;

    // Yamaganda segment offsets (Sun=4, Mon=3, Tue=2, Wed=1, Thu=0, Fri=6, Sat=5)
    const yamaSegments = [4, 3, 2, 1, 0, 6, 5];
    const yamaStart = st.rise + yamaSegments[w] * seg;
    const yamaEnd = yamaStart + seg;

    // Abhijit Muhurat: ~24 minutes before and after local noon
    const abhijitStart = st.noon - 24;
    const abhijitEnd = st.noon + 24;

    return {
      y, m, d, e,
      rise: st.rise, set: st.set, noon: st.noon,
      tithiIdx: tIdx, tithi: tn, paksha,
      monthIdx: mon, adhika, purniIdx: purni,
      vs: chaitradi, vsGuj: gujYear, shaka: chaitradi - 135,
      nat, tamil: tam, bengali: { d: ben.d, m: ben.m, y: bYear },
      nak, gujMonth: (mon + 5) % 12,
      rahuKaal: { start: rahuStart, end: rahuEnd },
      yamaganda: { start: yamaStart, end: yamaEnd },
      abhijit: { start: abhijitStart, end: abhijitEnd }
    };
  }

  function fmtMin(min) {
    min = Math.round(min);
    let h = Math.floor(min / 60) % 24;
    const m = min % 60;
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m < 10 ? '0' : ''}${m} ${ap}`;
  }

  return { computePanchang, fmtMin };
})();

const STORAGE_KEY = 'india_calendar_v2_cfg';
const defaultCfg = {
  tab: 'today',
  lang: 'en',
  city: 'delhi',
  theme: 'emerald',
  weekStart: 0, // 0: Sunday, 1: Monday
  reminders: ['2026-11-08|Diwali (Deepavali & Lakshmi Puja)', '2026-11-15|Chhath Puja (Sandhya Arghya)'],
  showMuhurat: true
};

let cfg = Object.assign({}, defaultCfg);
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) Object.assign(cfg, JSON.parse(saved));
} catch(e) {}

function saveCfg() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch(e) {}
}

const now = new Date();
const TODAY_STR = formatDateKey(now.getFullYear(), now.getMonth() + 1, now.getDate());

let selectedDate = TODAY_STR;
let viewYear = now.getFullYear();
let viewMonth = now.getMonth(); // 0..11
let calViewMode = 'grid'; // 'grid' or 'list'
let activeFestCategory = 'all';
let festivalSearchQuery = '';

/* Helper utilities */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function formatDateKey(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function parseDateKey(str) { const [y, m, d] = str.split('-').map(Number); return { y, m, d }; }
function getDiffDays(d1Str, d2Str) {
  const p1 = parseDateKey(d1Str), p2 = parseDateKey(d2Str);
  const u1 = Date.UTC(p1.y, p1.m - 1, p1.d);
  const u2 = Date.UTC(p2.y, p2.m - 1, p2.d);
  return Math.round((u2 - u1) / 86400000);
}
function t(key) {
  const langObj = I18N[cfg.lang] || I18N.en;
  return langObj[key] !== undefined ? langObj[key] : I18N.en[key] || key;
}
function getCity() {
  return CITIES.find(c => c.id === cfg.city) || CITIES[0];
}

/* Toast message helper */
function showToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

/* Fire celebration confetti */
function triggerConfetti() {
  if (typeof confetti === 'function') {
    confetti({
      particleCount: 75,
      spread: 70,
      origin: { y: 0.65 },
      colors: ['#f59e0b', '#dc2626', '#10b981', '#6366f1', '#ec4899']
    });
  }
}

/* SVG Moon Generator */
function getMoonSvg(elongationDeg, size = 64) {
  const r = size / 2 - 2;
  const c = size / 2;
  const rad = Math.PI / 180;
  const rx = Math.abs(Math.cos(elongationDeg * rad)) * r;
  let d = '';
  
  if (elongationDeg < 180) {
    const sw = elongationDeg < 90 ? 0 : 1;
    d = `M ${c} ${c - r} A ${r} ${r} 0 0 1 ${c} ${c + r} A ${rx} ${r} 0 0 ${sw} ${c} ${c - r} Z`;
  } else {
    const sw2 = elongationDeg < 270 ? 0 : 1;
    d = `M ${c} ${c - r} A ${r} ${r} 0 0 0 ${c} ${c + r} A ${rx} ${r} 0 0 ${sw2} ${c} ${c - r} Z`;
  }

  return `
    <svg class="moon-disc" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="#0f1f23" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <path d="${d}" fill="#fef08a" />
    </svg>
  `;
}

// RENDER: MONTH CALENDAR GRID VIEW
function renderMonthView() {
  const langObj = I18N[cfg.lang] || I18N.en;
  const daysInMonth = new Date(Date.UTC(viewYear, viewMonth + 1, 0)).getUTCDate();
  const firstDayWeekday = new Date(Date.UTC(viewYear, viewMonth, 1)).getUTCDay();
  const startOffset = (firstDayWeekday - cfg.weekStart + 7) % 7;
  const city = getCity();

  // Selected date details
  const selParsed = parseDateKey(selectedDate);
  const selPanchang = Eng.computePanchang(selParsed.y, selParsed.m, selParsed.d, city);
  const selFestivals = FESTIVALS_DATA.filter(f => f.date === selectedDate);
  const selWeekdayIdx = new Date(Date.UTC(selParsed.y, selParsed.m - 1, selParsed.d)).getUTCDay();

  // Grid cells & Agenda rows generation
  let cellsHtml = '';
  let agendaHtml = '';

  for (let i = 0; i < startOffset; i++) {
    cellsHtml += `<div class="cal-cell other-month"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const curKey = formatDateKey(viewYear, viewMonth + 1, d);
    const p = Eng.computePanchang(viewYear, viewMonth + 1, d, city);
    const dayWeekday = new Date(Date.UTC(viewYear, viewMonth, d)).getUTCDay();
    const isToday = curKey === TODAY_STR;
    const isSelected = curKey === selectedDate;
    const fests = FESTIVALS_DATA.filter(f => f.date === curKey);

    let dotsHtml = '';
    if (fests.length > 0) {
      dotsHtml += `<span class="cal-dot" style="--dot-color:var(--badge-fest)"></span>`;
    }
    if (p.tithiIdx === 14) {
      dotsHtml += `<span class="cal-moon-icon">🌕</span>`;
    } else if (p.tithiIdx === 29) {
      dotsHtml += `<span class="cal-moon-icon">🌑</span>`;
    }

    cellsHtml += `
      <div class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${dayWeekday === 0 ? 'sun' : ''}" data-date="${curKey}">
        <span class="cal-cell-num">${d}</span>
        <span class="cal-cell-tithi">${langObj.tithis[p.tithiIdx % 15]}</span>
        <div class="cal-indicators">${dotsHtml}</div>
      </div>
    `;

    // Row for Agenda / List View
    agendaHtml += `
      <div class="agenda-row ${isSelected ? 'selected' : ''}" data-date="${curKey}">
        <div class="agenda-date-box">
          <div style="display:flex; flex-direction:column; align-items:center; min-width:32px;">
            <span class="agenda-num" style="${dayWeekday === 0 ? 'color:var(--danger);' : ''}">${d}</span>
            <span class="agenda-dow">${langObj.weekdays[dayWeekday].slice(0, 3)}</span>
          </div>
          <div class="agenda-meta">
            <span class="agenda-tithi">${langObj.lunarMonths[p.monthIdx]} ${p.paksha === 'S' ? 'Shukla' : 'Krishna'} ${langObj.tithis[p.tithiIdx % 15]}</span>
            <span class="agenda-nak">✨ ${langObj.nakshatras[p.nak]} · 🌅 ${Eng.fmtMin(p.rise)}</span>
          </div>
        </div>
        ${fests.length > 0 ? `<span class="agenda-badge">${cfg.lang === 'hi' && fests[0].hi ? fests[0].hi : fests[0].name}</span>` : ''}
      </div>
    `;
  }

  // DOW Row headers
  let dowHtml = '';
  for (let i = 0; i < 7; i++) {
    const wIdx = (i + cfg.weekStart) % 7;
    dowHtml += `<div class="${wIdx === 0 ? 'sun' : ''}">${langObj.weekdays[wIdx].slice(0, 3)}</div>`;
  }

  return `
    <div class="card anim-fade" style="padding:12px 6px;">
      <div class="calendar-controls" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; padding:0 4px;">
        <div class="cal-title-block">
          <h3 style="font-size:1.15rem; font-weight:800; margin:0;">${langObj.months[viewMonth]} ${viewYear}</h3>
          <p style="font-size:0.75rem; color:var(--text-muted); margin:2px 0 0;">Vikram Samvat ${selPanchang.vs} · ${city.name}</p>
        </div>
        <div style="display:flex; gap:5px; align-items:center;">
          <!-- View switcher (Grid / List) -->
          <div style="display:flex; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:2px;">
            <button class="btn sm" id="btnViewGrid" style="padding:4px 8px; font-size:0.72rem; border:none; ${calViewMode === 'grid' ? 'background:var(--primary); color:#fff;' : 'background:transparent; color:var(--text);'}">⊞ Grid</button>

                  <button class="btn sm btn-remind" data-id="${f.date}|${f.name}" style="padding:4px 10px; font-size:0.75rem;">🔔 ${cfg.reminders.includes(f.date + '|' + f.name) ? t('following') : t('setRemind')}</button>

      ` : `
        <p style="font-size:0.82rem; color:var(--text-muted); margin:6px 0 0;">No major fasts or festivals recorded on this day.</p>
      `}
    </div>
  `;
}

// RENDER: FESTIVALS & SEARCH VIEW
function renderFestivalsView() {
  const langObj = I18N[cfg.lang] || I18N.en;

  // Filter festivals based on active tab & query
  const query = festivalSearchQuery.trim().toLowerCase();
  const filtered = FESTIVALS_DATA.filter(f => {
    const matchesCat = activeFestCategory === 'all' || f.cat === activeFestCategory;
    const matchesQuery = !query ||
      f.name.toLowerCase().includes(query) ||
      (f.hi && f.hi.toLowerCase().includes(query)) ||
      f.desc.toLowerCase().includes(query);
    return matchesCat && matchesQuery;
  }).sort((a, b) => a.date.localeCompare(b.date));

  return `
    <div class="card anim-fade">
      <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:12px;">🎉 Festivals of India (2026-2027)</h3>
      
      <!-- Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="festSearchInput" placeholder="${t('searchPlaceholder')}" value="${festivalSearchQuery}">
      </div>

      <!-- Category Filter Chips -->
      <div class="chips-scroll" id="festCategoryChips">
        <button class="chip-btn ${activeFestCategory === 'all' ? 'active' : ''}" data-cat="all">${t('all')}</button>
        <button class="chip-btn ${activeFestCategory === 'major' ? 'active' : ''}" data-cat="major">${t('major')}</button>
        <button class="chip-btn ${activeFestCategory === 'vrat' ? 'active' : ''}" data-cat="vrat">${t('vrat')}</button>
        <button class="chip-btn ${activeFestCategory === 'nat' ? 'active' : ''}" data-cat="nat">${t('national')}</button>
        <button class="chip-btn ${activeFestCategory === 'regional' ? 'active' : ''}" data-cat="regional">${t('regional')}</button>
      </div>

      <!-- Results Count -->
      <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:10px; font-weight:600;">Showing ${filtered.length} festivals</p>

      <!-- Festival List -->
      <div id="festivalListContainer">
        ${filtered.map(f => {
          const p = parseDateKey(f.date);
          const diff = getDiffDays(TODAY_STR, f.date);
          const isReminded = cfg.reminders.includes(f.date + '|' + f.name);

          return `
            <div class="fest-item-card" data-date="${f.date}">
              <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
                <div class="next-date-badge" style="width:52px; height:52px; border-radius:12px;">
                  <span class="day-num" style="font-size:1.3rem;">${p.d}</span>
                  <span class="month-lbl" style="font-size:0.65rem;">${langObj.months[p.m - 1].slice(0, 3)}</span>
                </div>
                <div style="flex:1; min-width:0;">
                  <h4 style="font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    ${cfg.lang === 'hi' && f.hi ? f.hi : f.name}
                  </h4>
                  <p style="font-size:0.78rem; color:var(--text-muted);">${f.desc}</p>
                  <span style="font-size:0.75rem; font-weight:700; color:${diff >= 0 ? 'var(--primary)' : 'var(--text-muted)'};">
                    ${diff >= 0 ? t('inDays')(diff) : `${Math.abs(diff)} days ago`}
                  </span>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:4px; margin-left:8px;">
                <button class="btn sm btn-remind" data-id="${f.date}|${f.name}" title="Set Reminder">
                  ${isReminded ? '🔔' : '🔕'}
                </button>
                <button class="btn sm btn-ics" data-name="${f.name}" data-date="${f.date}" title="Add to Calendar">
                  📅

              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// RENDER: REMINDERS VIEW

  }).sort((a, b) => a.date.localeCompare(b.date));

  return `
    <div class="card anim-fade">
      <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">🔔 ${t('tRemind')}</h3>

        <div style="text-align:center; padding:32px 16px; border:1px dashed var(--border); border-radius:16px;">

              <div class="fest-item-card">
                <div style="display:flex; align-items:center; gap:12px;">
                  <div class="next-date-badge" style="width:52px; height:52px; border-radius:12px;">
                    <span class="day-num" style="font-size:1.3rem;">${p.d}</span>
                    <span class="month-lbl" style="font-size:0.65rem;">${langObj.months[p.m - 1].slice(0, 3)}</span>
                  </div>
                  <div>
                    <h4 style="font-size:1rem; font-weight:700;">${f.name}</h4>
                    <p style="font-size:0.78rem; color:var(--text-muted);">${diff >= 0 ? t('inDays')(diff) : 'Past event'}</p>

                <div style="display:flex; gap:6px;">
                  <button class="btn sm btn-ics" data-name="${f.name}" data-date="${f.date}">📥 .ICS</button>
                  <button class="btn sm btn-remove-remind" data-id="${f.date}|${f.name}" style="color:var(--danger);">✕</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

/* =========================================================================
   6. CONTROLLER & EVENT LISTENERS
   ========================================================================= */

function applyTheme() {
  document.documentElement.removeAttribute('data-theme');
  if (cfg.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (cfg.theme === 'saffron') {
    document.documentElement.setAttribute('data-theme', 'saffron');
  }
}

function updateAppLanguageLabel() {
  const langNames = {
    en: '🌐 English',
    hi: '🇮🇳 हिन्दी',
    bn: '🇮🇳 বাংলা',
    ta: '🇮🇳 தமிழ்',
    te: '🇮🇳 తెలుగు',
    gu: '🇮🇳 ગુજરાતી',
    mr: '🇮🇳 मराठी',
    kn: '🇮🇳 ಕನ್ನಡ'
  };
  document.getElementById('currentLangLabel').textContent = langNames[cfg.lang] || '🌐 English';
}

function render() {
  applyTheme();
  updateAppLanguageLabel();

  // Highlight active bottom tab
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === cfg.tab);
  });

  const main = document.getElementById('appMain');
  if (cfg.tab === 'today') {
    main.innerHTML = renderTodayView();
  } else if (cfg.tab === 'month') {
    main.innerHTML = renderMonthView();
  } else if (cfg.tab === 'festivals') {
    main.innerHTML = renderFestivalsView();
  } else if (cfg.tab === 'reminders') {
    main.innerHTML = renderRemindersView();
  } else if (cfg.tab === 'settings') {
    main.innerHTML = renderSettingsView();
  }
}

/* iCalendar (.ics) Generator & Downloader */
function exportToICS(title, dateStr) {
  const cleanDate = dateStr.replace(/-/g, '');
  const icsData = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//All India Calendar//EN',
    'BEGIN:VEVENT',
    `SUMMARY:${title}`,
    `DTSTART;VALUE=DATE:${cleanDate}`,
    `DTEND;VALUE=DATE:${cleanDate}`,
    `DESCRIPTION:Observed in All India Calendar & Panchang`,
    'STATUS:CONFIRMED',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
  const link = document.createElement('a');
  link.href = window.URL.createObjectURL(blob);
  link.setAttribute('download', `${title.replace(/\s+/g, '_')}.ics`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast(`Downloaded .ics for ${title}`);
}

/* Document Event Delegation */
document.addEventListener('click', (e) => {
  // Navigation Tabs
  const tabBtn = e.target.closest('.tab-btn');
  if (tabBtn) {
    cfg.tab = tabBtn.dataset.tab;
    saveCfg();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  // Switch to Month view from Today button
  if (e.target.closest('#btnExploreMonth')) {
    cfg.tab = 'month';
    saveCfg();
    render();
    return;
  }

  // Switch City modal / fast change
  if (e.target.closest('#btnSwitchCity')) {
    cfg.tab = 'settings';
    saveCfg();
    render();
    return;
  }

  // Next Festival Card Click
  const nextFestCard = e.target.closest('#nextFestCard');
  if (nextFestCard && !e.target.closest('button')) {
    selectedDate = nextFestCard.dataset.date;
    const p = parseDateKey(selectedDate);
    viewYear = p.y;
    viewMonth = p.m - 1;
    cfg.tab = 'month';
    saveCfg();
    render();
    triggerConfetti();
    return;
  }

  // View Switcher (Grid / List)
  if (e.target.closest('#btnViewGrid')) {
    calViewMode = 'grid';
    render();
    return;
  }
  if (e.target.closest('#btnViewList')) {
    calViewMode = 'list';
    render();
    return;
  }

  // Agenda List Row select
  const agendaRow = e.target.closest('.agenda-row[data-date]');
  if (agendaRow) {
    selectedDate = agendaRow.dataset.date;
    render();
    return;
  }

  // WhatsApp Share button on selected day
  const waBtn = e.target.closest('.btn-wa-share');
  if (waBtn) {
    e.stopPropagation();
    const dStr = waBtn.dataset.date;
    const fName = waBtn.dataset.fest || '';
    const p = parseDateKey(dStr);
    const city = getCity();
    const pan = Eng.computePanchang(p.y, p.m, p.d, city);
    const langObj = I18N[cfg.lang] || I18N.en;

    const waText = `🌸 *${fName ? fName + ' · ' : ''}${dStr} Panchang*\n` +
      `✨ Tithi: ${langObj.lunarMonths[pan.monthIdx]} ${pan.paksha === 'S' ? 'Shukla' : 'Krishna'} ${langObj.tithis[pan.tithiIdx % 15]}\n` +
      `🌅 Sunrise: ${Eng.fmtMin(pan.rise)} | Sunset: ${Eng.fmtMin(pan.set)}\n` +
      `🌟 Nakshatra: ${langObj.nakshatras[pan.nak]}\n` +
      `⏱️ Abhijit: ${Eng.fmtMin(pan.abhijit.start)} - ${Eng.fmtMin(pan.abhijit.end)}\n` +
      `⚠️ Rahu Kaal: ${Eng.fmtMin(pan.rahuKaal.start)} - ${Eng.fmtMin(pan.rahuKaal.end)}\n\n` +
      `Shared from All India Calendar & Vedic Panchang`;

    const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(waText)}`;
    window.open(waUrl, '_blank');
    return;
  }

  // Month navigation buttons
  if (e.target.closest('#btnPrevMonth')) {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
    return;
  }
  if (e.target.closest('#btnNextMonth')) {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
    return;
  }
  if (e.target.closest('#btnCurrentMonth')) {
    const cur = new Date();
    viewYear = cur.getFullYear();
    viewMonth = cur.getMonth();
    selectedDate = TODAY_STR;
    render();
    return;
  }

  // Calendar Day Cell Select
  const calCell = e.target.closest('.cal-cell[data-date]');
  if (calCell) {
    selectedDate = calCell.dataset.date;
    render();
    return;
  }

  // Festival search category chip
  const chipBtn = e.target.closest('.chip-btn[data-cat]');
  if (chipBtn) {
    activeFestCategory = chipBtn.dataset.cat;
    render();
    return;
  }

  // Add to Calendar (.ics) export button
  const icsBtn = e.target.closest('.btn-ics');
  if (icsBtn) {
    e.stopPropagation();
    exportToICS(icsBtn.dataset.name, icsBtn.dataset.date);
    return;
  }

  // Set Reminder Toggle
  const remindBtn = e.target.closest('.btn-remind');
  if (remindBtn) {
    e.stopPropagation();
    const id = remindBtn.dataset.id;
    const idx = cfg.reminders.indexOf(id);
    if (idx >= 0) {
      cfg.reminders.splice(idx, 1);
      showToast('Reminder removed');
    } else {
      cfg.reminders.push(id);
      showToast('Reminder saved!');
      triggerConfetti();
    }
    saveCfg();
    render();
    return;
  }

  // Remove reminder in reminders view
  const removeRemindBtn = e.target.closest('.btn-remove-remind');
  if (removeRemindBtn) {
    e.stopPropagation();
    const id = removeRemindBtn.dataset.id;
    cfg.reminders = cfg.reminders.filter(r => r !== id);
    saveCfg();
    showToast('Reminder removed');
    render();
    return;
  }

  // Share Panchang (Clipboard & Web Share API)
  if (e.target.closest('#btnSharePanchang')) {
    const p = parseDateKey(TODAY_STR);
    const city = getCity();
    const pan = Eng.computePanchang(p.y, p.m, p.d, city);
    const langObj = I18N[cfg.lang] || I18N.en;

    const shareText = `📅 *${t('panchang')} - ${TODAY_STR} (${city.name})*\n` +
      `✨ Tithi: ${langObj.lunarMonths[pan.monthIdx]} ${pan.paksha === 'S' ? 'Shukla' : 'Krishna'} ${langObj.tithis[pan.tithiIdx % 15]}\n` +
      `🌅 Sunrise: ${Eng.fmtMin(pan.rise)} | Sunset: ${Eng.fmtMin(pan.set)}\n` +
      `🌟 Nakshatra: ${langObj.nakshatras[pan.nak]}\n` +
      `⏱️ Abhijit Muhurat: ${Eng.fmtMin(pan.abhijit.start)} - ${Eng.fmtMin(pan.abhijit.end)}\n` +
      `⚠️ Rahu Kaal: ${Eng.fmtMin(pan.rahuKaal.start)} - ${Eng.fmtMin(pan.rahuKaal.end)}\n\n` +
      `Shared from All India Calendar & Vedic Panchang`;

    if (navigator.share) {
      navigator.share({ title: 'Daily Panchang', text: shareText }).catch(() => {});
    } else {
      navigator.clipboard.writeText(shareText).then(() => {
        showToast(t('copied'));
      });
    }
    return;
  }

  // Toggle Theme quick button in header
  if (e.target.closest('#btnThemeToggle')) {
    const themes = ['emerald', 'saffron', 'dark'];
    const nextThemeIdx = (themes.indexOf(cfg.theme) + 1) % themes.length;
    cfg.theme = themes[nextThemeIdx];
    saveCfg();
    applyTheme();
    showToast(`Theme: ${cfg.theme.toUpperCase()}`);
    return;
  }

  // Open Language Modal
  if (e.target.closest('#btnLangSelect')) {
    const modal = document.getElementById('langModal');
    const list = document.getElementById('langOptionsList');
    const languages = [
      { code: 'en', label: 'English', native: 'English' },
      { code: 'hi', label: 'Hindi', native: 'हिन्दी' },
      { code: 'bn', label: 'Bengali', native: 'বাংলা' },
      { code: 'ta', label: 'Tamil', native: 'தமிழ்' },
      { code: 'te', label: 'Telugu', native: 'తెలుగు' },
      { code: 'gu', label: 'Gujarati', native: 'ગુજરાતી' },
      { code: 'mr', label: 'Marathi', native: 'मराठी' },
      { code: 'kn', label: 'Kannada', native: 'ಕನ್ನಡ' }
    ];

    list.innerHTML = languages.map(l => `
      <button class="btn ${cfg.lang === l.code ? 'primary' : ''}" data-lang="${l.code}" style="padding:12px 14px; text-align:left; flex-direction:column; align-items:flex-start;">
        <b style="font-size:1rem;">${l.native}</b>
        <small style="opacity:0.8;">${l.label}</small>
      </button>
    `).join('');

    modal.classList.add('open');
    return;
  }

  // Select language in modal
  const langChoice = e.target.closest('[data-lang]');
  if (langChoice) {
    cfg.lang = langChoice.dataset.lang;
    saveCfg();
    document.getElementById('langModal').classList.remove('open');
    render();
    return;
  }

  // Close language modal
  if (e.target.closest('#closeLangModal') || e.target.id === 'langModal') {
    document.getElementById('langModal').classList.remove('open');
    return;
  }
});

// Search input handling
document.addEventListener('input', (e) => {
  if (e.target.id === 'festSearchInput') {
    festivalSearchQuery = e.target.value;
    render();
    // Maintain focus at the end of input
    const input = document.getElementById('festSearchInput');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
});

// Settings dropdown changes
document.addEventListener('change', (e) => {
  if (e.target.id === 'selectCity') {
    cfg.city = e.target.value;
    saveCfg();
    render();
    showToast(`Location set to ${getCity().name}`);
  } else if (e.target.id === 'selectLanguageSetting') {
    cfg.lang = e.target.value;
    saveCfg();
    render();
  } else if (e.target.id === 'selectWeekStart') {
    cfg.weekStart = parseInt(e.target.value, 10);
    saveCfg();
    render();
  } else if (e.target.id === 'selectAppTheme') {
    cfg.theme = e.target.value;
    saveCfg();
    render();
  }
});

// Initial startup
render();

// Register Service Worker for offline PWA & Play Store compliance
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
